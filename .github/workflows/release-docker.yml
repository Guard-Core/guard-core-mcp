name: Publish hosted image to GHCR

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to a dated snapshot)"
        required: false
        type: string

jobs:
  cve-scan:
    permissions:
      contents: read
      security-events: write # SARIF
    uses: Guard-Core/.github/.github/workflows/cve-scan.yml@f993c869090ce2d5b9cfaebba93c318a86838456 # cve-scan (merged commit)
    with:
      tools_ref: f993c869090ce2d5b9cfaebba93c318a86838456
      images: |
        mcp-hosted=Dockerfile.hosted:.

  publish-image:
    needs: cve-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        name: Extract version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${DISPATCH_TAG:-${RELEASE_TAG:-$(date +'%Y.%m.%d')-snapshot}}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag could be determined"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.hosted
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/guard-core/guard-core-mcp:${{ steps.version.outputs.tag }}
            ghcr.io/guard-core/guard-core-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
