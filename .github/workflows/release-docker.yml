name: Publish hosted image to GHCR

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to a dated snapshot)"
        required: false
        type: string

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        name: Extract version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${DISPATCH_TAG:-${RELEASE_TAG:-$(date +'%Y.%m.%d')-snapshot}}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag could be determined"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.hosted
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/guard-core/guard-core-mcp:${{ steps.version.outputs.tag }}
            ghcr.io/guard-core/guard-core-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
