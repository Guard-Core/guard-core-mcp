name: Publish to MCP Registry
# Registers the server.json version with the MCP Registry only after that
# version is on PyPI: the registry validates the PyPI package, so publishing
# on the server.json push (before the release) always failed with a 404.
# release.yml dispatches it after the publish job (no privileged trigger on another run's completion), or it is run by hand.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: registry-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    permissions:
      id-token: write # trusted publishing: the registry login uses the GitHub OIDC token
      contents: read # check out the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Wait for the server.json version on PyPI
        run: |
          version=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/guard-core-mcp/$version/json"; then
              echo "guard-core-mcp $version is on PyPI"
              exit 0
            fi
            echo "waiting for guard-core-mcp $version on PyPI"
            sleep 30
          done
          echo "::error::guard-core-mcp $version did not appear on PyPI within 15 minutes"
          exit 1
      - name: Install mcp-publisher
        # Pinned to v1.8.7 (published 2026-10-30, past the 7-day cooldown). The SHA-256 is the mcp-publisher_linux_amd64.tar.gz line of the release's registry_1.8.7_checksums.txt, and it matched the GitHub release asset digest and two separate downloads at pin time.
        env:
          MCP_PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mcp-publisher.tar.gz "$MCP_PUBLISHER_URL"
          echo "$MCP_PUBLISHER_SHA256  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp
      - name: Skip when this version is already registered
        id: skip_check
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          with open("server.json") as f:
              meta = json.load(f)
          query = urllib.parse.quote(meta["name"], safe="")
          url = f"https://registry.modelcontextprotocol.io/v0/servers?search={query}"
          with urllib.request.urlopen(url) as response:
              payload = json.load(response)
          registered = [entry["server"]["version"] for entry in payload.get("servers", [])]
          skip = meta["version"] in registered
          print(f"registered versions: {registered}")
          print(f"version {meta['version']} already registered: {skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - name: Login and publish
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
