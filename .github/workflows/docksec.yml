name: DockSec

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - 'Dockerfile.hosted'
      - '.github/workflows/docksec.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '**/Dockerfile'
      - 'Dockerfile.hosted'
      - '.github/workflows/docksec.yml'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: Scan Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run DockSec
        uses: OWASP/DockSec@d52c8e928552dc39003abda21ac6bc4662b06c39 # v2026.9.21
        with:
          dockerfile: Dockerfile
          scan_only: 'true'
          sarif: 'true'
          output_dir: ${{ github.workspace }}/docksec-results

      - name: Upload SARIF to Code Scanning
        # Not `if: always()`: on a fork pull_request, GITHUB_TOKEN is read-only and this
        # upload would fail every time, turning a routine fork contribution into a red
        # required check. Skip it there instead of forcing a failure.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: docksec-results
          category: docksec

  scan-hosted:
    # DockSec keeps only files named exactly Dockerfile, so it never reports on Dockerfile.hosted,
    # the image release-docker.yml publishes. Lint and scan it, then build it and wait for its HEALTHCHECK.
    name: Scan Dockerfile.hosted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint with hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile.hosted

      - name: Scan with trivy config
        # --skip-check-update keeps the checks bundled with this pinned trivy, so the result only changes with the pin.
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 config --skip-check-update --exit-code 1 /src/Dockerfile.hosted

      - name: Build the image
        run: docker build -f Dockerfile.hosted -t guard-core-mcp-hosted:ci .

      - name: Wait for the HEALTHCHECK to pass
        run: |
          docker run -d --name hosted \
            -e GUARD_CORE_MCP_PUBLIC_URL=https://mcp.example.test \
            -e GUARD_CORE_MCP_OAUTH_ISSUER=https://auth.example.test \
            -e GUARD_CORE_MCP_OAUTH_JWKS_URL=https://auth.example.test/jwks.json \
            guard-core-mcp-hosted:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' hosted)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          docker logs hosted
          exit 1
