name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'compose.yml'
      - 'Dockerfile'
      - 'guard_core_mcp/**'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - 'docs/**'
      - 'Makefile'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    branches:
      - master
    paths:
      - 'compose.yml'
      - 'Dockerfile'
      - 'guard_core_mcp/**'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - 'docs/**'
      - 'Makefile'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'tests/**'
  schedule:
    # NOTE: Mondays @ 10 AM UTC. docs-drift compares the vendored _docs
    # against upstream repos that release independently of this one, so it
    # must run on a timer, not only when this repo changes.
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run tests
        run: |
          uv run pytest -v --cov=guard_core_mcp --cov-branch

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install uv
      - name: Check vendored docs are current
        run: |
          git clone --depth 1 https://github.com/Guard-Core/fastapi-guard ../fastapi-guard
          git clone --depth 1 https://github.com/Guard-Core/guard-core ../guard-core
          git clone --depth 1 https://github.com/Guard-Core/guard-agent ../guard-agent
          git clone --depth 1 https://github.com/Guard-Core/guard-core-ts ../guard-core-ts
          uv run python scripts/sync_docs.py
          DRIFT=$(git status --porcelain guard_core_mcp/_docs)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            echo "::error::guard_core_mcp/_docs is stale against the upstream repos — rerun scripts/sync_docs.py and commit the result"
            exit 1
          fi
