name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # NOTE: Mondays @ 10 AM UTC. docs-drift compares the vendored _docs
    # against upstream repos that release independently of this one, so it
    # must run on a timer, not only when this repo changes.
    - cron: '0 10 * * 1'
  workflow_dispatch:
  # release.yml calls this file so the release gate is the PR gate, never a copy of it.
  workflow_call:

permissions:
  contents: read # check out the repository

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request checks out the merge commit; the second commit is the base (its first parent).
          fetch-depth: 2

      - name: Decide whether any code path changed
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request the checkout is the merge commit: HEAD^1 is the base, so a depth-1 clone cannot answer.
          if ! files="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "::error::cannot diff HEAD^1 HEAD (shallow or non-merge checkout), refusing to guess"
            exit 1
          fi
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              context7.json|glama.json|smithery.yaml|.github/ISSUE_TEMPLATE/*) ;;
              */*) code=true; echo "code path: $f" ;;
              *.md|LICENSE) ;;
              *) code=true; echo "code path: $f" ;;
            esac
          done <<< "$files"
          echo "changed files: $(printf '%s' "$files" | wc -l | tr -d ' ')"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Tooling job with no test run: the dev tools need 3.11+; ruff target-version py310 and mypy python_version 3.10 still check against the 3.10 floor, and the test matrix owns the other versions.
          python-version: '3.11'
      - run: pip install uv==0.13.4
      - run: uv sync --locked --extra dev
      - name: Check uv.lock is tracked and in sync
        run: |
          test "$(git ls-files uv.lock)" = "uv.lock"
          rc=0
          git check-ignore -q uv.lock || rc=$?
          test "$rc" -eq 1
          uv lock --check
      - name: Test the lock scripts
        run: uv run --no-sync pytest .github/scripts/tests --no-cov -p no:cacheprovider
      - run: uv run pre-commit run --all-files

  test:
    name: test (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      # uv follows .python-version (3.10) unless told otherwise, so the matrix CPython was set up and never used.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Assert uv resolves the matrix interpreter (before sync)
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Assert the synced environment runs the matrix interpreter
        run: |
          uv run --no-sync python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Run tests
        run: |
          COVERAGE_FILE=coverage-py${MATRIX_PYTHON_VERSION}.data uv run pytest -v --cov=guard_core_mcp --cov-branch
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-py${{ matrix.python-version }}
          path: coverage-py${{ matrix.python-version }}.data
          if-no-files-found: error

  test-lowest-direct:
    name: test-lowest-direct (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      # uv follows .python-version (3.10) unless told otherwise, so the matrix CPython was set up and never used.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.13.4

      - name: Assert uv resolves the matrix interpreter (before sync)
        run: |
          uv run --no-project python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev

      - name: Assert the synced environment runs the matrix interpreter
        run: |
          uv run --no-sync python -c "import os, sys; assert '%d.%d' % sys.version_info[:2] == os.environ['EXPECTED_PYTHON'], sys.version; print(sys.version)"

      # 5.0.0 is not on PyPI: the engine comes from the gate's guard-core head (ecosystem-gate.yml builds the same wheel and force-installs it without dependencies).
      - name: Check out the engine head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core
          path: engine
          persist-credentials: false

      - name: Build the engine wheel
        run: |
          uv build --wheel --out-dir engine-dist engine

      - name: Install the shipped dependencies at their declared floors, the engine from its head
        run: |
          # starlette 1.3.1 imports the anyio.abc.BlockingPortal alias that anyio 4.15 deprecates and -W error turns into a failure: the floor suite runs with anyio 4.14.2 (D-240).
          echo 'anyio==4.14.2' > constraints.txt
          echo "guard-core @ file://$PWD/$(ls engine-dist/*.whl)" > overrides.txt
          uv pip compile pyproject.toml --constraint constraints.txt --override overrides.txt --extra hosted --resolution lowest-direct --python-version "$MATRIX_PYTHON_VERSION" --no-emit-package guard-core --no-emit-package guard-agent --no-emit-package fastapi-guard --no-header -o floors.txt
          uv pip install -r floors.txt
          uv pip install --no-deps --force-reinstall engine-dist/*.whl
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          COVERAGE_FILE=coverage-lowest-direct-py${MATRIX_PYTHON_VERSION}.data uv run --no-sync pytest -v --cov=guard_core_mcp --cov-branch
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}

  coverage:
    name: coverage (combined across the matrix)
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The reporter only reads the data files and the checked-out sources; it does not run the tests.
          python-version: '3.10'

      - name: Install uv
        run: |
          pip install uv==0.13.4

      # The test jobs' own environment: its coverage version and the project's coverage configuration
      # (plain coverage on 3.10 reads no pyproject.toml without the toml extra).
      - name: Install dependencies
        env:
          UV_PYTHON: '3.10'
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --locked --extra dev

      - name: Show the coverage configuration the combine reads
        run: |
          uv run --no-sync coverage debug config

      - name: Download every version's coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-py*
          path: coverage-data
          merge-multiple: true

      - name: Require the data of every matrix version
        run: |
          for v in 3.10 3.11 3.12 3.13 3.14 3.15; do
            test -f "coverage-data/coverage-py$v.data" || { echo "::error::no coverage data for Python $v"; exit 1; }
          done

      - name: Combine and gate
        run: |
          uv run --no-sync coverage combine coverage-data/coverage-py*.data
          uv run --no-sync coverage report -m --fail-under=100

  docs-drift:
    name: docs-drift
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Tooling job with no test run: 3.10 is the floor the lint and type config targets (mypy python_version 3.10); the test matrix owns the other versions.
          python-version: '3.10'
      - run: pip install uv==0.13.4
      - run: uv sync --locked --extra dev
      - name: Check vendored docs are current
        run: |
          git clone --depth 1 https://github.com/Guard-Core/fastapi-guard ../fastapi-guard
          git clone --depth 1 https://github.com/Guard-Core/guard-core ../guard-core
          git clone --depth 1 https://github.com/Guard-Core/guard-agent ../guard-agent
          git clone --depth 1 https://github.com/rennf93/guard-core-ts ../guard-core-ts
          uv run python scripts/sync_docs.py
          DRIFT=$(git status --porcelain guard_core_mcp/_docs)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            echo "::error::guard_core_mcp/_docs is stale against the upstream repos — rerun scripts/sync_docs.py and commit the result"
            exit 1
          fi

  ci:
    name: ci
    needs: [changes, pre-commit, test, coverage, docs-drift, test-lowest-direct]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes: $CHANGES_RESULT"
            exit 1
          fi
          case "$CODE" in
            true) accepted='["success"]' ;;
            false) accepted='["success","skipped"]' ;;
            *) echo "::error::changes output code is '$CODE', expected true or false"; exit 1 ;;
          esac
          bad="$(jq -r --argjson ok "$accepted" 'del(.changes) | to_entries[] | select(.value.result as $r | $ok | index($r) | not) | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
          echo "every gating job is green (code=$CODE)"
