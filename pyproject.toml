[project]
name = "guard-core-mcp"
version = "1.4.4"
description = "MCP server for the Guard ecosystem - config validation, docs search and live threat detection for fastapi-guard, guard-core and guard-agent."
authors = [
    {name = "Renzo Franceschini", email = "rennf93@guard-core.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2",
    "pydantic",
    "pyjwt[crypto]",
    "starlette",
    "uvicorn",
]

[project.scripts]
guard-core-mcp = "guard_core_mcp.server:main"
guard-core-mcp-http = "guard_core_mcp.http_server:main"

[project.urls]
Homepage = "https://github.com/Guard-Core/guard-core-mcp"
Repository = "https://github.com/Guard-Core/guard-core-mcp"
Documentation = "https://guard-core.github.io/guard-core-mcp/"
Issues = "https://github.com/Guard-Core/guard-core-mcp/issues"
Changelog = "https://github.com/Guard-Core/guard-core-mcp/blob/master/CHANGELOG.md"

[project.optional-dependencies]
hosted = [
    "fastapi-guard",
    "guard-agent",
    "guard-core",
]
dev = [
    "bandit[toml]",
    "deptry",
    "fastapi-guard",
    "guard-agent",
    "guard-core",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pymarkdownlnt",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "radon",
    "ruff",
    "safety",
    "vulture",
    "xenon",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guard_core_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".env",
    ".envrc",
    ".venv/",
    ".github/",
    ".claude/",
    "CLAUDE.md",
    ".pre-commit-config.yaml",
    "compose.yml",
    "Dockerfile",
    "Makefile",
    "mkdocs.yml",
    "vulture_whitelist.py",
    "tests/",
    "docs/",
]

[tool.ruff]
target-version = "py310"
exclude = [".venv", "guard_core_mcp/_docs"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "I",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=guard_core_mcp --cov-branch --cov-report=term-missing"
filterwarnings = ["error"]
markers = [
    "e2e: drives a real server subprocess over the MCP stdio transport",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = [".venv"]

[tool.pymarkdown.system]
exclude_path = ".venv,.git,.github,data,tests,.claude,CLAUDE.md,.cursor,.kiro,ZZZ"

[tool.pymarkdown.plugins.md003]
enabled = false

[tool.pymarkdown.plugins.md022]
enabled = false

[tool.pymarkdown.plugins.md032]
enabled = false

[tool.pymarkdown.plugins.md007]
enabled = true
indent = 2

[tool.pymarkdown.plugins.md012]
enabled = true
maximum = 2

[tool.pymarkdown.plugins.md013]
enabled = false

[tool.pymarkdown.plugins.md024]
enabled = true
siblings_only = true

[tool.pymarkdown.plugins.md033]
enabled = false

[tool.pymarkdown.plugins.md035]
enabled = false

[tool.pymarkdown.plugins.md041]
enabled = false

[tool.pymarkdown.plugins.md046]
enabled = false

[tool.pymarkdown.plugins.md029]
enabled = false

[tool.vulture]
paths = ["guard_core_mcp", "tests", "vulture_whitelist.py"]
exclude = ["**/conftest.py", ".venv", "guard_core_mcp/_docs"]
min_confidence = 100
ignore_decorators = [
    "@mcp.tool",
    "@pytest.fixture",
    "@pytest.mark.*",
]
ignore_names = [
    "test_*",
    "Test*",
    "cleanup_*",
    "mock_*",
    "expected_*",
    "exc_*",
    "__*__",
]
sort_by_size = true

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests", ".venv", "guard_core_mcp/_docs"]
severity = "medium"

[tool.radon]
exclude = "tests/*,.venv/*,vulture_whitelist.py,guard_core_mcp/_docs/*"
cc_min = "C"
mi_min = "A"
no_assert = false
show_closures = true
total_average = true

[tool.xenon]
max_absolute = "B"
max_modules = "A"
max_average = "A"
exclude = ["tests/*", ".venv/*", "vulture_whitelist.py", "guard_core_mcp/_docs/*"]
ignore = []

[tool.deptry]
exclude = ["tests", ".venv", "vulture_whitelist.py", "guard_core_mcp/_docs", "docs"]
extend_exclude = ["conftest.py"]
known_first_party = ["guard_core_mcp"]
per_rule_ignores = { "DEP002" = [
    "bandit",
    "deptry",
    "fastapi-guard",
    "guard-agent",
    "guard-core",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pymarkdownlnt",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "radon",
    "ruff",
    "safety",
    "vulture",
    "xenon",
] }
