site_name: Guard Core MCP
site_description: MCP server for the Guard ecosystem - config validation, docs search and live threat detection for fastapi-guard, guard-core and guard-agent.
site_url: https://rennf93.github.io/guard-core-mcp/latest/
repo_name: rennf93/guard-core-mcp
repo_url: https://github.com/rennf93/guard-core-mcp
edit_uri: edit/master/docs/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: dark-blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: dark-blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/guard_core_logo.svg
  favicon: assets/guard_core_favicon.png

nav:
  - Home: index.md
  - Installation: installation.md
  - Tools: tools.md
  - ChatGPT plugin: chatgpt-plugin.md
  - Release Notes: release-notes.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [guard_core_mcp, .]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            show_if_no_docstring: true
            filters: ["!^_"]
            merge_init_into_class: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rennf93/guard-core-mcp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/guard-core-mcp/

  analytics:
    provider: custom

  generator: false
  meta:
    - property: og:type
      content: website
    - property: og:title
      content: Guard Core MCP - MCP Server for the Guard Ecosystem
    - property: og:description
      content: MCP server for the Guard ecosystem - config validation, docs search and live threat detection for fastapi-guard, guard-core and guard-agent.
    - property: og:image
      content: https://rennf93.github.io/guard-core-mcp/latest/assets/guard_core_logo.svg
    - name: keywords
      content: mcp, model context protocol, fastapi-guard, guard-core, guard-agent, security, python, ai agents

  version:
    provider: mike
    default: latest
    version_selector: true
    json_file: /guard-core-mcp/versions.json

  author:
    name: Renzo Franceschini
    url: https://github.com/rennf93

copyright: Guard Core MCP by

extra_css:
  - css/custom.css
